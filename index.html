<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Scanner</title>
<meta name="theme-color" content="#f4f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scanner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#f4f1ea; --card:#fffdf8; --ink:#1d1b18; --muted:#7a746a; --line:#e3ddd1;
    --accent:#1f4e45; --accent-ink:#fff; --soft:#e8efe9; --danger:#b3412e;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:16px}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
  h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1}
  .lang{font-size:13px;font-weight:600;padding:7px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
  .tabs{display:flex;gap:6px;padding:6px 18px 10px}
  .tab{flex:1;padding:10px;border-radius:12px;font-weight:600;font-size:15px;color:var(--muted);background:transparent}
  .tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
  main{flex:1;padding:4px 18px 120px}
  .empty{margin-top:24px;text-align:center;padding:36px 20px;border:1.5px dashed var(--line);border-radius:22px;background:var(--card)}
  .empty h2{font-size:20px;margin:14px 0 6px}
  .empty p{color:var(--muted);margin:0 0 22px;line-height:1.5;font-size:15px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-weight:600;font-size:16px}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:var(--card);border:1px solid var(--line)}
  .btn.danger{color:var(--danger);background:var(--card);border:1px solid var(--line)}
  .btn.block{display:flex;width:100%}
  .btn:disabled{opacity:.45}
  .stack{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:6px}
  .pg{position:relative;background:var(--card);border-radius:12px;border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:8px}
  .pg img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#ece8df;border-radius:6px;display:block}
  .pg .num{position:absolute;top:14px;left:14px;background:rgba(29,27,24,.75);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
  .pg .acts{display:flex;justify-content:space-between}
  .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
  .ic:active{background:var(--soft)}
  .ic svg{width:19px;height:19px}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);}
  .bar .inner{max-width:684px;margin:0 auto;display:flex;gap:10px}
  .bar .btn{flex:1;box-shadow:0 6px 20px rgba(0,0,0,.08)}
  .hint{color:var(--muted);font-size:14px;margin:4px 2px 10px}
  /* overlays */
  .ov{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;background:#141312;color:#fff;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .ov.show{display:flex}
  .ov .top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
  .ov .top .t{font-weight:600}
  .ov .tbtn{padding:9px 14px;border-radius:10px;font-weight:600;color:#fff}
  .ov .tbtn.go{background:#fff;color:#141312}
  .stage{flex:1;position:relative;min-height:0}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .tools{padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .chip{flex:none;padding:9px 14px;border-radius:999px;background:#2a2826;color:#ddd;font-size:14px;font-weight:600}
  .chip.on{background:#fff;color:#141312}
  .tline{display:flex;gap:10px}
  .tline .tbtn{flex:1;background:#2a2826;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px}
  .preview{position:absolute;inset:10px;display:grid;place-items:center}
  .preview img{max-width:100%;max-height:100%;box-shadow:0 8px 30px rgba(0,0,0,.5);background:#fff}
  .busy{position:absolute;inset:0;display:none;place-items:center;color:#ccc;font-size:14px}
  .busy.show{display:grid}
  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(20,19,18,.45);z-index:30;display:none;align-items:flex-end;justify-content:center}
  .scrim.show{display:flex}
  .sheet{width:100%;max-width:560px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
  .sheet h3{margin:4px 0 14px;font-size:18px}
  .sheet label{font-size:13px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
  .sheet input{width:100%;font:inherit;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:14px}
  .note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:10px}
  .dlg{background:var(--card);border-radius:18px;padding:20px;margin:auto 18px;max-width:380px;width:100%}
  .dlg p{margin:0 0 18px;line-height:1.5}
  .scrim.center{align-items:center}
  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;transition:.25s;z-index:50;pointer-events:none;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}
  /* library */
  .lib{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;width:100%}
  .li img{width:54px;height:70px;object-fit:cover;border-radius:6px;background:#ece8df;flex:none}
  .li .meta{flex:1;min-width:0}
  .li .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .search{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:6px}
  input[type=file]{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M4 12h16"/></svg></div>
    <h1 data-t="title"></h1>
    <button class="lang" id="langBtn"></button>
  </header>

  <main id="scanView">
    <div id="emptyState" class="empty">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#1f4e45" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
      <h2 data-t="emptyH"></h2>
      <p data-t="emptyP"></p>
      <div class="stack" style="max-width:320px;margin:0 auto">
        <button class="btn primary block" data-act="camera"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/></svg><span data-t="takePhoto"></span></button>
        <button class="btn ghost block" data-act="gallery" data-t="fromPhotos"></button>
      </div>
    </div>
    <div id="pagesWrap" style="display:none">
      <div class="hint" id="pageCount"></div>
      <div class="grid" id="grid"></div>
    </div>
  </main>

</div>

<div class="bar" id="scanBar" style="display:none"><div class="inner">
  <button class="btn ghost" data-act="camera"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-t="addPage"></span></button>
  <button class="btn primary" id="saveBtn"><span data-t="save"></span></button>
</div></div>

<input type="file" id="camIn" accept="image/*" capture="environment">
<input type="file" id="galIn" accept="image/*" multiple>

<!-- Editor -->
<div class="ov" id="editor">
  <div class="top">
    <button class="tbtn" id="edCancel" data-t="cancel"></button>
    <span class="t" id="edTitle"></span>
    <button class="tbtn go" id="edNext"></button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cropCv"></canvas>
    <div class="preview" id="prevWrap" style="display:none"><img id="prevImg" alt=""></div>
    <div class="busy" id="busy" data-t="processing"></div>
  </div>
  <div class="tools" id="cropTools">
    <div class="tline">
      <button class="tbtn" id="fullBtn"><span data-t="wholePhoto"></span></button>
      <button class="tbtn" id="autoBtn"><span data-t="resetCrop"></span></button>
    </div>
  </div>
  <div class="tools" id="adjTools" style="display:none">
    <div class="chips" id="filterChips"></div>
    <div class="tline">
      <button class="tbtn" id="rotL"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button class="tbtn" id="rotR"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button class="tbtn" id="backCrop"><span data-t="crop"></span></button>
    </div>
  </div>
</div>

<!-- Save sheet -->
<div class="scrim" id="saveScrim"><div class="sheet">
  <h3 data-t="saveH"></h3>
  <label for="fname" data-t="fileName"></label>
  <input id="fname" autocomplete="off">
  <div class="stack">
    <button class="btn primary block" id="pdfBtn"><span data-t="savePdf"></span></button>
    <button class="btn ghost block" id="jpgBtn"></button>
    <button class="btn danger block" id="clearBtn"><span data-t="clearAll"></span></button>
  </div>
  <div class="note" id="saveNote"></div>
</div></div>

<!-- Confirm / item dialog -->
<div class="scrim center" id="dlgScrim"><div class="dlg">
  <p id="dlgText"></p>
  <div class="stack" id="dlgBtns"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
/* ---------- i18n ---------- */
const T = {
 en:{title:"Home Scanner",tabScan:"Scan",tabLib:"Library",emptyH:"Scan a document",
  emptyP:"Take a photo of any page. You'll trim the edges, clean it up, then save it as a PDF or JPEG.",
  takePhoto:"Take photo",fromPhotos:"Choose from photos",addPage:"Add page",save:"Save",
  cancel:"Cancel",next:"Next",done:"Done",processing:"Processing…",wholePhoto:"Whole photo",resetCrop:"Auto-detect",
  crop:"Crop",cropT:"Drag the corners",adjT:"Adjust",
  f_original:"Original",f_enhanced:"Enhanced",f_gray:"Grayscale",f_bw:"Black & white",
  pages:n=>n===1?"1 page":n+" pages",saveH:"Save scan",fileName:"File name",savePdf:"Save as PDF",
  saveJpg:n=>n===1?"Save as JPEG":"Save as JPEGs ("+n+" files)",saveLib:"Save to shared library",clearAll:"Clear & start new",
  noDl:"Saving files isn't available in this view. Open this page in the Claude app or at claude.ai to save.",
  noLib:"The shared library isn't available in this view.",
  libNote:"Library scans are shared with everyone you've given Editor access to this page.",
  saved:"Saved",savedLib:"Saved to library",declined:"Save cancelled",err:"Something went wrong — please try again",
  pdfErr:"PDF maker didn't load. Check your internet connection and reopen.",
  confirmClear:"Clear all pages? Anything not saved will be lost.",clear:"Clear",
  confirmDel:"Delete this page?",del:"Delete",libEmpty:"No saved scans yet. Scan something and tap Save → Save to shared library.",
  libLoading:"Loading library…",libSlow:"Can't reach the library yet — check your connection.",search:"Search scans",
  dlPdf:"Download PDF",delScan:"Delete from library",confirmDelScan:"Delete this scan for both of you?",close:"Close",
  uploading:"Uploading…",page:"Page",ready:"Your file is ready.",shareSave:"Save / Share",shareNote:"On a phone, choose \"Save to Files\" or \"Save Image\" in the share sheet — or send it straight to KakaoTalk, Mail, etc. Tip: add this page to your home screen to use it like an app."},
 ko:{title:"홈 스캐너",tabScan:"스캔",tabLib:"보관함",emptyH:"문서 스캔하기",
  emptyP:"문서를 사진으로 찍은 뒤 가장자리를 맞추고 선명하게 보정해 PDF나 JPEG로 저장하세요.",
  takePhoto:"사진 찍기",fromPhotos:"사진에서 선택",addPage:"페이지 추가",save:"저장",
  cancel:"취소",next:"다음",done:"완료",processing:"처리 중…",wholePhoto:"전체 사진",resetCrop:"자동 감지",
  crop:"자르기",cropT:"모서리를 끌어 맞추세요",adjT:"보정",
  f_original:"원본",f_enhanced:"선명하게",f_gray:"흑백(회색)",f_bw:"흑백 문서",
  pages:n=>n+"페이지",saveH:"스캔 저장",fileName:"파일 이름",savePdf:"PDF로 저장",
  saveJpg:n=>n===1?"JPEG로 저장":"JPEG로 저장 ("+n+"개 파일)",saveLib:"공유 보관함에 저장",clearAll:"모두 지우고 새로 시작",
  noDl:"이 화면에서는 파일 저장이 지원되지 않습니다. Claude 앱이나 claude.ai에서 열어 주세요.",
  noLib:"이 화면에서는 공유 보관함을 사용할 수 없습니다.",
  libNote:"보관함의 스캔은 이 페이지의 편집자 권한이 있는 사람과 공유됩니다.",
  saved:"저장됨",savedLib:"보관함에 저장됨",declined:"저장 취소됨",err:"문제가 발생했습니다. 다시 시도해 주세요.",
  pdfErr:"PDF 기능을 불러오지 못했습니다. 연결을 확인하고 다시 열어 주세요.",
  confirmClear:"모든 페이지를 지울까요? 저장하지 않은 내용은 사라집니다.",clear:"지우기",
  confirmDel:"이 페이지를 삭제할까요?",del:"삭제",libEmpty:"저장된 스캔이 없습니다. 스캔 후 저장 → 공유 보관함에 저장을 누르세요.",
  libLoading:"보관함 불러오는 중…",libSlow:"보관함에 연결할 수 없습니다. 연결을 확인해 주세요.",search:"스캔 검색",
  dlPdf:"PDF 다운로드",delScan:"보관함에서 삭제",confirmDelScan:"이 스캔을 삭제할까요? 두 분 모두에게서 삭제됩니다.",close:"닫기",
  uploading:"업로드 중…",page:"페이지",ready:"파일이 준비되었습니다.",shareSave:"저장 / 공유",shareNote:"휴대폰에서는 공유 화면에서 \"파일에 저장\" 또는 \"이미지 저장\"을 선택하거나 카카오톡, 메일 등으로 바로 보낼 수 있습니다. 팁: 이 페이지를 홈 화면에 추가하면 앱처럼 사용할 수 있어요."}
};
let lang = "en";
try{ lang = localStorage.getItem("scan_lang") || ((navigator.language||"").startsWith("ko")?"ko":"en"); }catch(e){}
const t = (k,...a) => { const v=(T[lang]||T.en)[k]; return typeof v==="function"?v(...a):(v??k); };

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function applyLang(){
  document.documentElement.lang = lang;
  $$("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $("#langBtn").textContent = lang==="en"?"한국어":"English";
  renderPages(); renderLib(); renderChips(); updateEditorLabels();
}
$("#langBtn").onclick = () => { lang = lang==="en"?"ko":"en"; try{localStorage.setItem("scan_lang",lang)}catch(e){} applyLang(); };

/* ---------- toast & dialog ---------- */
let toastTimer;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),2400); }
function dialog(text, buttons){
  return new Promise(res=>{
    $("#dlgText").textContent=text;
    const box=$("#dlgBtns"); box.innerHTML="";
    buttons.forEach(b=>{ const el=document.createElement("button"); el.className="btn block "+(b.cls||"ghost"); el.textContent=b.label;
      el.onclick=()=>{ $("#dlgScrim").classList.remove("show"); res(b.value); }; box.appendChild(el); });
    $("#dlgScrim").classList.add("show");
  });
}
$("#dlgScrim").addEventListener("click",e=>{ if(e.target.id==="dlgScrim"){ $("#dlgScrim").classList.remove("show"); }});

const tab="scan";
const renderLib=()=>{};

/* ---------- pages state ---------- */
const pages=[]; // {id, src:canvas, corners, filter, rot, warped, out, thumb}
let uid=0;

$$("[data-act=camera]").forEach(b=>b.onclick=()=>{ $("#camIn").value=""; $("#camIn").click(); });
$$("[data-act=gallery]").forEach(b=>b.onclick=()=>{ $("#galIn").value=""; $("#galIn").click(); });
$("#camIn").onchange=e=>handleFiles(e.target.files);
$("#galIn").onchange=e=>handleFiles(e.target.files);

async function handleFiles(files){
  files=[...(files||[])]; if(!files.length) return;
  const queue=[];
  for(const f of files){
    try{ const c=await loadImage(f); queue.push(c); }catch(e){ toast(t("err")); }
  }
  for(const c of queue){
    const p={id:++uid,src:c,corners:startCorners(c),filter:"enhanced",rot:0};
    const ok=await openEditor(p,true);
    if(ok){ pages.push(p); renderPages(); }
  }
}

function loadImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const MAX=2600; let w=img.naturalWidth,h=img.naturalHeight; const s=Math.min(1,MAX/Math.max(w,h));
      w=Math.round(w*s); h=Math.round(h*s); const c=document.createElement("canvas"); c.width=w; c.height=h;
      const x=c.getContext("2d"); x.imageSmoothingQuality="high"; x.drawImage(img,0,0,w,h); URL.revokeObjectURL(url); res(c); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("load")); };
    img.src=url;
  });
}
function defaultCorners(c){ const w=c.width,h=c.height,mx=w*.06,my=h*.06;
  return [[mx,my],[w-mx,my],[w-mx,h-my],[mx,h-my]]; }
function detectCorners(c){
  try{
    const S=220, s=Math.min(1,S/Math.max(c.width,c.height)), w=Math.max(8,Math.round(c.width*s)), h=Math.max(8,Math.round(c.height*s));
    const t=document.createElement("canvas"); t.width=w; t.height=h; const x=t.getContext("2d"); x.drawImage(c,0,0,w,h);
    const d=x.getImageData(0,0,w,h).data, n=w*h, L=new Uint8Array(n), hist=new Array(256).fill(0);
    for(let i=0;i<n;i++){ const r=d[i*4],g=d[i*4+1],b=d[i*4+2]; const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
      const v=Math.max(0,((r*77+g*150+b*29)>>8)-(mx-mn)*0.5)|0; L[i]=v; hist[v]++; } // paper = bright & low saturation
    let sum=0; for(let i=0;i<256;i++) sum+=i*hist[i];

function solveH(src,dst){ // maps dst(x,y)->src(u,v)
  const A=[],B=[];
  for(let i=0;i<4;i++){ const [x,y]=dst[i],[u,v]=src[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y]); B.push(u);
    A.push([0,0,0,x,y,1,-v*x,-v*y]); B.push(v); }
  const n=8; for(let i=0;i<n;i++){ A[i].push(B[i]); }
  for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r;
    [A[c],A[p]]=[A[p],A[c]]; const d=A[c][c]||1e-12;
    for(let r=0;r<n;r++){ if(r===c) continue; const f=A[r][c]/d; if(!f) continue; for(let k=c;k<=n;k++) A[r][k]-=f*A[c][k]; } }
  const h=[]; for(let i=0;i<n;i++) h.push(A[i][n]/A[i][i]); h.push(1); return h;
}

  const s=Math.min(1,2200/Math.max(W,H)); W=Math.max(8,Math.round(W*s)); H=Math.max(8,Math.round(H*s));
  const h=solveH(q,[[0,0],[W,0],[W,H],[0,H]]);
  const sw=srcC.width, sh=srcC.height, sd=srcC.getContext("2d").getImageData(0,0,sw,sh).data;
  const out=document.createElement("canvas"); out.width=W; out.height=H;
  const oc=out.getContext("2d"), od=oc.createImageData(W,H), o=od.data;
  for(let y=0;y<H;y++){
    const yy=y+.5; let x0=h[1]*yy+h[2], y0=h[4]*yy+h[5], w0=h[7]*yy+h[8];
    for(let x=0;x<W;x++){
      const xx=x+.5, w=h[6]*xx+w0; let u=(h[0]*xx+x0)/w-.5, v=(h[3]*xx+y0)/w-.5;
      if(u<0)u=0; if(v<0)v=0; if(u>sw-1.001)u=sw-1.001; if(v>sh-1.001)v=sh-1.001;

    for(let y=0;y<gh;y++) for(let x=0;x<gw;x++){ let s=0,c=0; for(let k=-r;k<=r;k++){ const yy=y+k; if(yy>=0&&yy<gh){s+=b[yy*gw+x];c++;} } e[y*gw+x]=s/c; }

      for(let c=0;c<3;c++){ d[j+c]=curve[Math.min(255,d[j+c]*k)|0]; }
    }else{

}
function rotate(c,r){

  const box=$("#dlgBtns"); box.innerHTML="";
  const ok=document.createElement("button"); ok.className="btn block primary"; ok.textContent=t("shareSave");
  ok.onclick=()=>{ $("#dlgScrim").classList.remove("show"); shareNow(files); };
  const no=document.createElement("button"); no.className="btn block ghost"; no.textContent=t("cancel");
  no.onclick=()=>$("#dlgScrim").classList.remove("show");
  box.append(ok,no); $("#dlgScrim").classList.add("show");
}
function handleSaveErr(e){ if(e&&e.message==="nopdf") toast(t("pdfErr")); else toast(t("err")); }
async function withBusy(btn,fn){ btn.disabled=true; const old=btn.innerHTML; btn.textContent=t("processing"); try{ await fn(); } finally{ btn.innerHTML=old; btn.disabled=false; updateSaveSheet(); } }
$("#pdfBtn").onclick=e=>withBusy(e.currentTarget,async()=>{
  try{ await prepareAndOffer(async()=>{ const blob=await buildPdf(); return [new File([blob],cleanName()+".pdf",{type:"application/pdf"})]; }); }
  catch(err){ handleSaveErr(err); }
});
$("#jpgBtn").onclick=e=>withBusy(e.currentTarget,async()=>{
  try{ await prepareAndOffer(async()=>{ const base=cleanName(), out=[];
    for(let i=0;i<pages.length;i++){ const blob=await canvasBlob(pages[i].out,.9);
      out.push(new File([blob],pages.length===1?base+".jpg":`${base} (${i+1}).jpg`,{type:"image/jpeg"})); }
    return out; }); }
  catch(err){ handleSaveErr(err); }
});
$("#clearBtn").onclick=async()=>{
  $("#saveScrim").classList.remove("show");
  if(await dialog(t("confirmClear"),[{label:t("clear"),cls:"danger",value:true},{label:t("cancel"),value:false}])){ pages.length=0; renderPages(); }
};

applyLang();
})();
</script>
</body>
</html>
